name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Docker image. node:sqlite needs 22.5+.
          node-version: '24'
          cache: npm

      - run: npm ci

      # Two organizer tests build real archives with the `zip` binary, which is
      # present on GitHub runners but deliberately not in the slim image.
      - name: Check zip is available
        run: zip --version | head -1

      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    # Pull requests build to verify the Dockerfile but must not publish.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 for a normal server, arm64 for a Synology/Pi. The build stage
          # pins to BUILDPLATFORM, so arm64 costs almost nothing extra.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test the built image
        # Only on a real push: the multi-arch build above does not load into the
        # local daemon, so this rebuilds the native arch and actually runs it.
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build --load -t vl-collection-builder:smoke .
          docker run -d --name smoke -p 8080:8080 \
            -e REGION_PREFERENCE=USA,Europe \
            -e SETUP_SKIP=true \
            -e DOWNLOADS_ENABLED=false \
            vl-collection-builder:smoke

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then break; fi
            sleep 2
          done

          echo "--- /api/health ---"
          curl -fsS http://127.0.0.1:8080/api/health

          # The organizer silently degrades without chdman, so assert it is there.
          echo "--- chdman ---"
          docker exec smoke sh -c 'chdman --version 2>&1 | head -1' | grep -qi chdman

          # And that unattended setup actually applied the region preference.
          echo "--- setup ---"
          curl -fsS http://127.0.0.1:8080/api/setup/state | grep -q '"completed":true'

          docker logs smoke
          docker rm -f smoke
